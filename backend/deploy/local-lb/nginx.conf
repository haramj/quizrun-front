# 로컬에서 NCP Application Load Balancer를 흉내 내는 설정 (수업 Day4: Target Group + 라운드 로빈).
# 실제 NCP에서는 이 파일 대신 Load Balancer / Target Group을 콘솔에서 만든다.
upstream quizrun_targets {
    # 기본 분산 알고리즘 = Round Robin (수업 Day4: "서버 사양이 동일하면 기본 선택")
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://quizrun_targets;
        # 서버 한 대가 죽었을 때 요청을 다른 서버로 다시 보낸다 (Health Check로 대상에서 제외되는 동작과 유사)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        # 죽은 서버(응답이 없는 서버)에 오래 매달리지 않고 빨리 다음 서버로 넘어간다.
        # 기본값(60초)이면 장애 서버로 간 요청 하나가 1분 가까이 멈춘다. NCP LB는 Health Check 주기(5~300초)가 이 역할을 한다.
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 어느 서버가 응답했는지 확인용(발표/검증 때 사용): 응답 헤더 X-Served-By
        add_header X-Served-By $upstream_addr always;
    }
}
