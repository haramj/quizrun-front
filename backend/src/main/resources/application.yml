server:
  port: ${PORT:3000}
  shutdown: graceful

spring:
  application:
    name: quizrun-back
  # 기본은 파일 H2(로컬/단일 서버). NCP Cloud DB for MySQL을 쓰려면 환경변수만 바꾼다:
  #   DB_URL=jdbc:mysql://<private-host>:3306/quizrun?characterEncoding=UTF-8  DB_USER=...  DB_PASSWORD=...
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/quizrun}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # 학습/MVP용. 운영에서는 Flyway 같은 마이그레이션으로 교체

# 로드밸런서 헬스체크용: /actuator/health (liveness/readiness 분리)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


quizrun:
  # 방 보관 시간 (기본 6시간). redis 모드에서는 방 키의 TTL이 된다.
  room-ttl-minutes: 360

  # 방 상태 저장소 (수업 Day4 무상태 설계)
  #   memory: 서버 1대(로컬 개발·테스트). 서버를 2대 이상으로 늘리면 안 된다.
  #   redis : Cloud DB for Cache(Redis). 서버를 여러 대로 늘릴 수 있다.
  # 운영에서는 이 값을 직접 바꾸지 말고 스프링 프로파일 redis를 켠다: SPRING_PROFILES_ACTIVE=redis
  # (application-redis.yml이 저장소와 헬스체크 설정을 함께 바꾼다)
  room-store: memory
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    timeout-ms: 2000
    lock-lease-ms: 10000   # 락을 잡은 서버가 죽어도 이 시간 뒤 자동 해제
    lock-wait-ms: 5000     # 락을 기다리는 한도. 넘으면 503

  # 문제 신고: 서로 다른 신고자가 이 횟수에 도달하면 그 문제를 자동으로 출제에서 제외한다.
  report:
    threshold: ${REPORT_THRESHOLD:3}

  # 관리자 API(문제 비활성화/복구) 토큰. 비워 두면 관리자 API가 꺼진다. 코드/설정 파일에 값을 넣지 말 것.
  admin:
    token: ${ADMIN_TOKEN:}

  # 방 생성 후 문제를 백그라운드에서 준비한다(AI 생성은 15~30초). threads = 동시 생성 상한, queue = 대기 가능한 방 수.
  prepare:
    threads: 4
    queue: 50

  quiz:
    # 한 판에서 문제은행(DB)에서 가져오는 비율. 나머지는 새로 생성한다. 문제은행이 커지면 올린다.
    bank-ratio: 0.3

  # CLOVA Studio(HyperCLOVA X) 즉석 문제 생성. 키는 코드/설정 파일에 두지 말고 환경변수로만 주입한다.
  clova:
    api-key: ${NCP_CLOVA_API_KEY:}
    model: HCX-007
    timeout-seconds: 60
    max-concurrent: 2

  # 문제의 근거가 되는 자료. 위키백과가 기본, 본문이 짧으면 나무위키로 보강한다.
  sources:
    user-agent: "quizrun-student-project/0.2 (NCP course project)"
    wikipedia-url: https://ko.wikipedia.org
    namu-enabled: true
    namu-url: https://namu.wiki
    thin-chars: 6000
