# 서버 2대 + 로드밸런서 + Redis + MySQL을 로컬에서 한 번에 띄우는 구성 (수업 Day4 "2-Tier"를 흉내 낸 검증용)
#
#   브라우저 ──▶ lb(nginx, :8080) ──▶ app1 / app2 (Spring Boot, 같은 코드) ──▶ redis (방 상태) · mysql (문제은행)
#
#   실행:  docker compose -f docker-compose.scale.yml up --build        →  http://localhost:8080
#   필요:  .env 에 MYSQL_PASSWORD, ADMIN_TOKEN (선택: NCP_CLOVA_API_KEY)   ※ .env.example 참고
#   주의:  NCP 리소스가 아니라 개발·검증용 흉내다. 운영 구성은 docs/architecture.md, docs/deploy-vm.md.
name: quizrun-scale

x-app: &app
  image: quizrun-back:dev
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    SPRING_PROFILES_ACTIVE: redis                     # 방 상태를 Redis에 둔다 (무상태)
    REDIS_HOST: redis
    DB_URL: jdbc:mysql://mysql:3306/quizrun?characterEncoding=UTF-8&serverTimezone=UTC
    DB_USER: quizrun
    DB_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/front/
  volumes:
    - ../public:/front:ro
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      MYSQL_DATABASE: quizrun
      MYSQL_USER: quizrun
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app1:
    <<: *app
    environment:
      <<: *app-env
      SERVER_NAME: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      SERVER_NAME: app2
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      # 두 서버가 동시에 켜지며 같은 테이블을 만들려다 충돌하는 것(ddl-auto=update)을 피한다.
      # 운영에서는 스키마를 SQL로 먼저 적용하고 ddl-auto를 validate로 둔다 (docs/database-design.md).
      app1: { condition: service_healthy }

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/local-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }

volumes:
  mysql-data:
